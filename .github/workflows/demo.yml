name: MR demo

# Runs only when a collaborator comments `/demo` on a pull request.
on:
  issue_comment:
    types: [created]

concurrency:
  group: demo-${{ github.event.issue.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  record:
    # Pull requests only, exact command, trusted commenters only.
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/demo') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    # The pull request code runs here, so this job gets no write access.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sha: ${{ steps.pr.outputs.sha }}
    steps:
      - id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: context.issue.number,
            });
            // Never run code coming from a fork.
            if (pr.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              core.setFailed('The demo only runs for branches of this repository.');
            }
            core.setOutput('sha', pr.head.sha);
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm run build
      - run: npm run demo
      - uses: actions/upload-artifact@v4
        with:
          name: demo
          path: |
            demo-output/*.png
            demo-output/demo.gif

  publish:
    needs: record
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: demo
          path: demo
      - name: Push the demo to the mr-assets branch
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.issue.number }}
        run: |
          repo_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$repo_url" mr-assets >/dev/null; then
            git clone --depth 1 --branch mr-assets "$repo_url" assets
          else
            git init assets
            git -C assets checkout --orphan mr-assets
          fi
          rm -rf "assets/pr-${PR}"
          mkdir -p "assets/pr-${PR}"
          cp demo/* "assets/pr-${PR}/"
          cd assets
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "📸 demo for #${PR}"
          git push "$repo_url" mr-assets
      - uses: actions/github-script@v7
        env:
          SHA: ${{ needs.record.outputs.sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.issue.number;
            const base = `https://raw.githubusercontent.com/${owner}/${repo}/mr-assets/pr-${pr}`;
            const v = process.env.SHA; // busts the image cache on every run
            const marker = '<!-- mr-demo -->';
            const body = [
              marker,
              '## 📸 Demo',
              '',
              `![Demo](${base}/demo.gif?v=${v})`,
              '',
              '| Start | Midweek | Weekend |',
              '| --- | --- | --- |',
              ['start', 'midweek', 'weekend']
                .map((name) => `![${name}](${base}/${name}.png?v=${v})`)
                .join(' | ')
                .replace(/^/, '| ') + ' |',
              '',
              `Recorded on \`${v.slice(0, 7)}\`. Comment \`/demo\` to record it again.`,
              '',
              '---',
              '_Generated by [Claude Code](https://claude.ai/code)_',
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pr,
            });
            const existing = comments.find((c) => c.body?.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: pr, body });
            }
