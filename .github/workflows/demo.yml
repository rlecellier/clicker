name: MR demo

# The demo is recorded only when a collaborator comments `/demo` on a pull
# request. It is the e2e journeys (`e2e/`) played with video and screenshots on.
# Its files are removed when the pull request is merged or closed, if a demo
# was recorded.
on:
  issue_comment:
    types: [created]
  pull_request:
    types: [closed]

concurrency:
  group: demo-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

permissions: {}

jobs:
  record:
    # Pull requests only, exact command, trusted commenters only.
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/demo') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    # The pull request code runs here, so this job gets no write access.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sha: ${{ steps.pr.outputs.sha }}
    steps:
      - id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: context.issue.number,
            });
            // Never run code coming from a fork.
            if (pr.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              core.setFailed('The demo only runs for branches of this repository.');
            }
            core.setOutput('sha', pr.head.sha);
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm run e2e
        env:
          CI: 'true'
          DEMO: '1'
      - name: Turn the recordings into a GIF and screenshots
        run: |
          mkdir demo
          i=0
          for video in test-results/*/video.webm; do
            ffmpeg -loglevel error -i "$video" \
              -vf "fps=10,split[a][b];[a]palettegen[p];[b][p]paletteuse" \
              -loop 0 "demo/journey-${i}.gif"
            i=$((i + 1))
          done
          i=0
          for shot in test-results/*/test-finished-1.png; do
            cp "$shot" "demo/screenshot-${i}.png"
            i=$((i + 1))
          done
      - uses: actions/upload-artifact@v4
        with:
          name: demo
          path: demo
          retention-days: 1

  publish:
    needs: record
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: demo
          path: demo
      - name: Store the demo on the mr-assets branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/mr-assets.sh add "${{ github.event.issue.number }}" demo
      - uses: actions/github-script@v7
        env:
          SHA: ${{ needs.record.outputs.sha }}
        with:
          script: |
            const fs = require('node:fs');
            const { owner, repo } = context.repo;
            const pr = context.issue.number;
            const base = `https://raw.githubusercontent.com/${owner}/${repo}/mr-assets/pr-${pr}`;
            const v = process.env.SHA; // busts the image cache on every run
            const marker = '<!-- mr-demo -->';
            const files = fs.readdirSync('demo').sort();
            const image = (name) => `![${name}](${base}/${name}?v=${v})`;
            const body = [
              marker,
              '## 📸 Demo',
              '',
              ...files.filter((f) => f.endsWith('.gif')).map(image),
              '',
              ...files.filter((f) => f.endsWith('.png')).map(image),
              '',
              `Recorded on \`${v.slice(0, 7)}\`. Comment \`/demo\` to record it again.`,
              'These files are deleted when the pull request is merged or closed.',
              '',
              '---',
              '_Generated by [Claude Code](https://claude.ai/code)_',
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pr,
            });
            const existing = comments.find((c) => c.body?.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: pr, body });
            }

  cleanup:
    # Merged or closed: nothing of the demo must outlive the pull request.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # No demo comment means /demo was never run: nothing to clean up.
      - id: demo
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: context.issue.number,
            });
            const demos = comments.filter((c) => c.body?.startsWith('<!-- mr-demo -->'));
            core.setOutput('found', demos.length > 0);
            core.setOutput('comment_ids', JSON.stringify(demos.map((c) => c.id)));
      - if: steps.demo.outputs.found == 'true'
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Remove the demo files
        if: steps.demo.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/mr-assets.sh remove "${{ github.event.pull_request.number }}"
      - name: Remove the demo comment
        if: steps.demo.outputs.found == 'true'
        uses: actions/github-script@v7
        env:
          COMMENT_IDS: ${{ steps.demo.outputs.comment_ids }}
        with:
          script: |
            const { owner, repo } = context.repo;
            for (const comment_id of JSON.parse(process.env.COMMENT_IDS)) {
              await github.rest.issues.deleteComment({ owner, repo, comment_id });
            }
