name: MR demo

# The demo runs on every pull request, when it is opened and on each push. The
# screenshots it takes are the ones listed in `e2e/demo.json`, taken by the e2e
# journeys (`e2e/`) through `demoShot`. Its files are removed when the pull
# request is merged or closed.
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: demo-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions: {}

jobs:
  record:
    # Never run code coming from a fork.
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # The pull request code runs here, so this job gets no write access.
    permissions:
      contents: read
    outputs:
      count: ${{ steps.collect.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          CI: 'true'
          DEMO: '1'
      - id: collect
        run: |
          mkdir -p demo
          echo "count=$(find demo -name '*.png' | wc -l)" >> "$GITHUB_OUTPUT"
      - if: steps.collect.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: demo
          path: demo
          retention-days: 1

  publish:
    needs: record
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - if: needs.record.outputs.count != '0'
        uses: actions/download-artifact@v4
        with:
          name: demo
          path: demo
      - name: Store the screenshots on the mr-assets branch
        if: needs.record.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/mr-assets.sh add "${{ github.event.pull_request.number }}" demo
      # No screenshot listed in `e2e/demo.json`: nothing to show.
      - name: Drop the files of a previous run
        if: needs.record.outputs.count == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/mr-assets.sh remove "${{ github.event.pull_request.number }}"
      - uses: actions/github-script@v7
        env:
          SHA: ${{ github.event.pull_request.head.sha }}
          COUNT: ${{ needs.record.outputs.count }}
        with:
          script: |
            const fs = require('node:fs');
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request.number;
            const marker = '<!-- mr-demo -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pr,
            });
            const existing = comments.find((c) => c.body?.startsWith(marker));
            if (process.env.COUNT === '0') {
              if (existing) {
                await github.rest.issues.deleteComment({ owner, repo, comment_id: existing.id });
              }
              return;
            }
            const base = `https://raw.githubusercontent.com/${owner}/${repo}/mr-assets/pr-${pr}`;
            const v = process.env.SHA; // busts the image cache on every run
            const body = [
              marker,
              '## 📸 Screenshots',
              '',
              ...fs.readdirSync('demo').sort().map((name) => `![${name}](${base}/${name}?v=${v})`),
              '',
              `Taken on \`${v.slice(0, 7)}\`, from the list in \`e2e/demo.json\`.`,
              'These files are deleted when the pull request is merged or closed.',
              '',
              '---',
              '_Generated by [Claude Code](https://claude.ai/code)_',
            ].join('\n');
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: pr, body });
            }

  cleanup:
    # Merged or closed: nothing of the demo must outlive the pull request.
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # No demo comment means no screenshot was ever taken: nothing to clean up.
      - id: demo
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: context.issue.number,
            });
            const demos = comments.filter((c) => c.body?.startsWith('<!-- mr-demo -->'));
            core.setOutput('found', demos.length > 0);
            core.setOutput('comment_ids', JSON.stringify(demos.map((c) => c.id)));
      - if: steps.demo.outputs.found == 'true'
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Remove the demo files
        if: steps.demo.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/mr-assets.sh remove "${{ github.event.pull_request.number }}"
      - name: Remove the demo comment
        if: steps.demo.outputs.found == 'true'
        uses: actions/github-script@v7
        env:
          COMMENT_IDS: ${{ steps.demo.outputs.comment_ids }}
        with:
          script: |
            const { owner, repo } = context.repo;
            for (const comment_id of JSON.parse(process.env.COMMENT_IDS)) {
              await github.rest.issues.deleteComment({ owner, repo, comment_id });
            }
