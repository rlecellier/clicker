name: CI

# Lint, types, format, unit tests, build and e2e journeys on every pull request
# and on `main`, so a red change cannot be merged unnoticed.
on:
  # `closed` only exists to cancel the runs still queued for a merged or closed
  # pull request: it joins their concurrency group, and its jobs are skipped.
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  e2e:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm run e2e
        env:
          CI: 'true'
          # Chrome is preinstalled on the runner: no browser download.
          CHROMIUM_PATH: /usr/bin/google-chrome
